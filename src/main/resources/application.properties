spring.application.name=channel-service

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mci.base-url=${MCI_BASE_URL:http://localhost:8082}

app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8081}

app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
